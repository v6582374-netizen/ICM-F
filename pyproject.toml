[project]
name = "occupational-dna"
version = "0.1.0"
description = "Task-level analysis of generative AI impacts on occupations and curricula."
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["occupational_dna"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
